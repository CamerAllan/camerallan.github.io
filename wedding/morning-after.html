<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<script>
// Language and lock state are set before the page draws, so nothing flashes.
try {
  if (localStorage.getItem('weddingLang') === 'es') document.documentElement.lang = 'es';
  var v = JSON.parse(localStorage.getItem('weddingVerified') || 'null');
  var c = (new URLSearchParams(location.search).get('code') || '').trim().toUpperCase();
  if (!v || (c && c !== v.code)) document.documentElement.classList.add('locked');
} catch (e) { document.documentElement.classList.add('locked'); }
</script>
<title>The morning after · Cameron &amp; Annie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1><a href="index.html">Cameron &amp; Annie</a></h1>
    <div class="muted"><span data-lang="en">Saturday 12 June 2027</span><span data-lang="es">Sábado, 12 de junio de 2027</span> · Rowallan Castle</div>
    <nav class="site-nav"><a href="index.html"><span data-lang="en">Home</span><span data-lang="es">Inicio</span></a><a href="itinerary.html"><span data-lang="en">Your itinerary</span><span data-lang="es">Vuestro itinerario</span></a><a href="rsvp.html"><span data-lang="en">RSVP</span><span data-lang="es">Confirmar asistencia</span></a><a href="travel.html"><span data-lang="en">Travel &amp; Stay</span><span data-lang="es">Viaje y alojamiento</span></a><a href="faqs.html"><span data-lang="en">FAQs</span><span data-lang="es">Preguntas frecuentes</span></a></nav>
    <div class="lang-switch"><a href="#" data-set-lang="es" data-lang="en" title="Ver en español" aria-label="Ver en español">🇪🇸</a><a href="#" data-set-lang="en" data-lang="es" title="View in English" aria-label="View in English">🇬🇧</a></div>
  </header>

  <section>
    <h2><span data-lang="en">The morning after</span><span data-lang="es">La mañana siguiente</span></h2>
    <div id="ma"><div class="loading" role="status"><span class="spinner" aria-hidden="true"></span></div></div>
  </section>
</main>
<script src="common.js"></script>
<script src="events.js"></script>
<script>
withInvite(data => {
  const rows = rowsFor(data, 'morning_after');
  $('ma').innerHTML = rows.length
    ? timelineHtml(rows, data)
    : `<p>${t('nothingMorning')}</p><p><a href="wedding.html">${esc(eventTitle('wedding'))} →</a></p>`;
}, 'ma');
</script>

</body>
</html>
